[alembic]
# Anchored to this file, not the process working directory. A bare relative
# script_location is resolved against the cwd, so importing prism.prod from
# anywhere but the project root raised "Path doesn't exist: alembic".
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
# Without this alembic splits the path above on spaces, commas and colons, and
# warns on every invocation that it is doing so.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
